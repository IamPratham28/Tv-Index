<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart TV Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #070b14;
  color: #fff;
  font-family: Roboto, "Amazon Ember", "Helvetica Neue", Arial, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}
body {
  background: -webkit-linear-gradient(top, #13233f 0%, #070b14 75%);
  background: linear-gradient(to bottom, #13233f 0%, #070b14 75%);
}
#app {
  height: 100%;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  padding: 0 56px;
  box-sizing: border-box;
}
#top {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  height: 88px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
#nav span {
  display: inline-block;
  font-size: 20px;
  font-weight: 500;
  padding: 8px 22px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  margin-right: 12px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
#statusPill {
  font-size: 16px !important;
  color: #9fb0cf;
  background: rgba(15, 23, 42, 0.6) !important;
}
#clock {
  font-size: 24px;
  font-weight: 500;
  color: #c8d3e8;
}
#hero {
  height: 170px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-justify-content: flex-end;
  justify-content: flex-end;
  padding-bottom: 24px;
}
#heroTitle {
  font-size: 50px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.5px;
}
#heroSub {
  font-size: 21px;
  color: #9fb0cf;
  margin-top: 8px;
}
#scroller {
  -webkit-flex: 1;
  flex: 1;
  overflow: hidden;
  position: relative;
}
#grid {
  padding: 16px 0 60px 12px;
  -webkit-transition: -webkit-transform 0.22s ease-out;
  transition: transform 0.22s ease-out;
}
.secT {
  font-size: 22px;
  font-weight: 500;
  color: #9fb0cf;
  margin: 0 0 18px 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.row {
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
}
.tile {
  width: 268px;
  height: 154px;
  margin: 0 28px 34px 0;
  border-radius: 16px;
  position: relative;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-transition: -webkit-transform 0.16s ease, box-shadow 0.16s ease;
  transition: transform 0.16s ease, box-shadow 0.16s ease;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
}
.tile .mark {
  font-size: 52px;
  font-weight: 700;
  line-height: 1;
}
.tile .name {
  font-size: 22px;
  margin-top: 10px;
  font-weight: 500;
}
.tile .badge {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.45);
  color: #e2e8f0;
  font-weight: 500;
}
.badge.ok { color: #4ade80; }
.badge.mirror { color: #38bdf8; }
.badge.wait { color: #facc15; }
.tile.on {
  -webkit-transform: scale(1.1);
  transform: scale(1.1);
  box-shadow: 0 0 0 4px #fff, 0 18px 38px rgba(0, 0, 0, 0.65);
  z-index: 2;
}
#notice {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  display: none;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-flex-direction: column;
  flex-direction: column;
  background: #070b14;
  text-align: center;
  z-index: 10;
  padding: 32px;
}
#notice h1 {
  font-size: 46px;
  font-weight: 600;
  margin: 0 0 14px;
}
#notice p {
  font-size: 24px;
  color: #9fb0cf;
  margin: 0;
}
#toast {
  position: fixed;
  bottom: 36px;
  left: 50%;
  -webkit-transform: translateX(-50%);
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 12px 28px;
  border-radius: 999px;
  font-size: 20px;
  display: none;
  z-index: 9;
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="nav">
      <span>Smart Hub</span>
      <span id="statusPill">Cloud Syncing...</span>
    </div>
    <div id="clock"></div>
  </div>
  <div id="hero">
    <div id="heroTitle">Welcome</div>
    <div id="heroSub">Select a channel using your Fire TV Remote</div>
  </div>
  <div id="scroller">
    <div id="grid"></div>
  </div>
</div>

<div id="notice">
  <h1 id="nTitle"></h1>
  <p id="nMsg"></p>
</div>
<div id="toast"></div>

<script>
/* Pure ES5 for Fire OS 5 WebView Hardware Accelerated Engine */
(function () {
  var CONFIG_URL = "https://raw.githubusercontent.com/IamPratham28/Tv-config/refs/heads/main/config.json";
  var PING_TIMEOUT = 3500;
  var COLORS = ["#2d5bd1", "#c2410c", "#0f766e", "#7c3aed", "#be185d", "#4d7c0f"];

  /* Emergency Embedded Fallback Config (Runs if GitHub is unreachable on 1st boot) */
  var DEFAULT_CONFIG = {
    "version": 2,
    "maintenance": { "enabled": false, "message": "Back soon!" },
    "tiles": [
      {
        "id": "yt",
        "title": "YouTube TV",
        "subtitle": "Leanback 1080p Smart TV Player",
        "icon": "youtube",
        "color": "#b91c1c",
        "urls": ["https://www.youtube.com/tv"]
      },
      {
        "id": "cricket",
        "title": "Cricket",
        "subtitle": "Live scores and match centre",
        "icon": "cricket",
        "color": "#15803d",
        "urls": [
          "https://www.cricbuzz.com/cricket-match/live-scores",
          "https://www.espncricinfo.com/live-cricket-score",
          "https://allrounderlive.in/"
        ]
      },
      {
        "id": "home",
        "title": "My Media Server",
        "subtitle": "Cloud Movies & Shows (Multi-Mirror Failover)",
        "icon": "film",
        "color": "#0f766e",
        "urls": [
          "https://arise-str.vercel.app/",
          "https://hicine.biz/",
          "https://watch-v2.autoembed.app/watch/tv"
        ]
      }
    ]
  };

  var ICONS = {
    cricket: '<svg width="58" height="58" viewBox="0 0 64 64"><rect x="8" y="30" width="30" height="9" rx="3" transform="rotate(-45 23 34)" fill="#f5d9a8"/><rect x="3" y="45" width="14" height="5" rx="2" transform="rotate(-45 10 47)" fill="#8a5a2b"/><circle cx="45" cy="41" r="12" fill="#fff"/><path d="M37 36 Q45 41 37 47 M53 35 Q45 41 53 47" stroke="#c2410c" stroke-width="2.5" fill="none"/></svg>',
    youtube: '<svg width="58" height="58" viewBox="0 0 64 64"><rect x="4" y="14" width="56" height="36" rx="10" fill="#fff"/><path d="M26 23 L26 41 L42 32 Z" fill="#e11d1d"/></svg>',
    film: '<svg width="58" height="58" viewBox="0 0 64 64"><rect x="8" y="10" width="48" height="44" rx="6" fill="#fff"/><rect x="14" y="10" width="6" height="44" fill="#0f766e"/><rect x="44" y="10" width="6" height="44" fill="#0f766e"/><path d="M27 25 L27 39 L39 32 Z" fill="#0f766e"/></svg>'
  };

  var tiles = [], idx = 0, busy = false, retryMode = false;
  function $(id) { return document.getElementById(id); }

  function saveCache(c) {
    try { localStorage.setItem("tv_cfg_v2", JSON.stringify(c)); } catch (e) {}
  }
  function readCache() {
    try {
      var raw = localStorage.getItem("tv_cfg_v2");
      return raw ? JSON.parse(raw) : DEFAULT_CONFIG;
    } catch (e) {
      return DEFAULT_CONFIG;
    }
  }

  function loadConfig(done) {
    var finished = false;
    function fail() {
      if (finished) return;
      finished = true;
      done(readCache(), true);
    }
    try {
      var x = new XMLHttpRequest();
      x.open("GET", CONFIG_URL + "?t=" + new Date().getTime(), true);
      x.timeout = 6000;
      x.onload = function () {
        if (x.status >= 200 && x.status < 300) {
          try {
            var c = JSON.parse(x.responseText);
            if (finished) return;
            finished = true;
            saveCache(c);
            done(c, false);
            return;
          } catch (e) {}
        }
        fail();
      };
      x.onerror = fail;
      x.ontimeout = fail;
      x.send();
    } catch (err) {
      fail();
    }
  }

  /* Favicon Ping for Auto-Healing Stream Selection */
  function ping(url, cb) {
    var a = document.createElement("a");
    a.href = url;
    var img = new Image(), done = false;
    function end(ok) {
      if (done) return;
      done = true;
      img.onload = img.onerror = null;
      cb(ok);
    }
    img.onload = function () { end(true); };
    img.onerror = function () { end(false); };
    setTimeout(function () { end(false); }, PING_TIMEOUT);
    img.src = a.protocol + "//" + a.host + "/favicon.ico?t=" + new Date().getTime();
  }

  /* Background Pre-Flight Health Check */
  function autoHealTile(tileObj) {
    var urls = tileObj.data.urls || [];
    if (!urls.length) return;
    var i = 0;
    function checkNext() {
      if (i >= urls.length) {
        tileObj.bestUrl = urls[0];
        tileObj.badge.textContent = "Primary";
        tileObj.badge.className = "badge";
        return;
      }
      var candidate = urls[i];
      var currentAttempt = i;
      i++;
      ping(candidate, function (ok) {
        if (ok) {
          tileObj.bestUrl = candidate;
          if (currentAttempt === 0) {
            tileObj.badge.textContent = "Online";
            tileObj.badge.className = "badge ok";
          } else {
            tileObj.badge.textContent = "Mirror #" + (currentAttempt + 1);
            tileObj.badge.className = "badge mirror";
          }
          if (tiles[idx] === tileObj) updateHero(tileObj);
        } else {
          checkNext();
        }
      });
    }
    checkNext();
  }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.style.display = "block";
  }
  function untoast() {
    $("toast").style.display = "none";
  }

  function openTile(tileObj) {
    if (busy) return;
    var d = tileObj.data;
    var urls = d.urls || [];
    if (!urls.length) return;

    /* Instant Launch if Background Auto-Heal already verified a working mirror */
    if (tileObj.bestUrl) {
      busy = true;
      toast("Launching " + d.title + "...");
      window.location.href = tileObj.bestUrl;
      setTimeout(function () { busy = false; untoast(); }, 3000);
      return;
    }

    busy = true;
    toast("Finding best server for " + d.title + "...");
    var i = 0;
    (function next() {
      if (i >= urls.length) {
        go(urls[0]);
        return;
      }
      var u = urls[i++];
      ping(u, function (ok) {
        if (ok) go(u);
        else next();
      });
    })();

    function go(u) {
      window.location.href = u;
      setTimeout(function () { busy = false; untoast(); }, 3000);
    }
  }

  function showNotice(title, msg) {
    $("nTitle").textContent = title;
    $("nMsg").textContent = msg;
    $("notice").style.display = "-webkit-flex";
    $("notice").style.display = "flex";
  }

  function render(cfg, offline) {
    if (!cfg) {
      retryMode = true;
      showNotice("No Connection", "Check your Wi-Fi, then press Select on remote to retry.");
      return;
    }
    if (cfg.maintenance && cfg.maintenance.enabled) {
      retryMode = true;
      showNotice("System Maintenance", (cfg.maintenance.message || "Back soon.") + " Press Select to refresh.");
      return;
    }

    retryMode = false;
    $("notice").style.display = "none";
    $("statusPill").textContent = offline ? "Cached Mode (v" + (cfg.version || 1) + ")" : "Cloud Live (v" + (cfg.version || 1) + ")";

    var grid = $("grid");
    grid.innerHTML = "";
    tiles = [];

    var secs = cfg.sections || [{ title: "Your Channels & Apps", tiles: cfg.tiles || [] }];
    var count = 0;

    for (var s = 0; s < secs.length; s++) {
      var list = secs[s].tiles || [];
      if (!list.length) continue;

      var h = document.createElement("div");
      h.className = "secT";
      h.textContent = secs[s].title || "";

      var row = document.createElement("div");
      row.className = "row";
      grid.appendChild(h);
      grid.appendChild(row);

      for (var i = 0; i < list.length; i++) {
        (function (t, cIdx) {
          var el = document.createElement("div");
          el.className = "tile";
          el.style.background = t.color || COLORS[cIdx % COLORS.length];

          var badge = document.createElement("div");
          badge.className = "badge wait";
          badge.textContent = "Checking...";

          var m = document.createElement("div");
          m.className = "mark";
          if (t.icon && ICONS[t.icon]) m.innerHTML = ICONS[t.icon];
          else m.textContent = (t.title || "?").charAt(0).toUpperCase();

          var n = document.createElement("div");
          n.className = "name";
          n.textContent = t.title || "";

          el.appendChild(badge);
          el.appendChild(m);
          el.appendChild(n);
          row.appendChild(el);

          var itemIndex = tiles.length;
          var tileObj = { el: el, data: t, badge: badge, bestUrl: null };
          tiles.push(tileObj);

          el.onclick = function () {
            focus(itemIndex);
            openTile(tileObj);
          };

          /* Trigger Pre-Flight Health Check in background */
          autoHealTile(tileObj);
        })(list[i], count);
        count++;
      }
    }

    if (offline) {
      toast("Cloud unreachable: Loaded saved backup config");
      setTimeout(untoast, 3000);
    }
    idx = 0;
    focus(0);
  }

  function updateHero(t) {
    $("heroTitle").textContent = t.data.title || "";
    var sub = t.data.subtitle || "Press Select on remote to launch";
    if (t.bestUrl && t.data.urls && t.data.urls.length > 1) {
      var a = document.createElement("a");
      a.href = t.bestUrl;
      sub += "  •  Active Route: " + a.hostname;
    }
    $("heroSub").textContent = sub;
  }

  function focus(i) {
    if (!tiles.length) return;
    if (tiles[idx]) tiles[idx].el.className = "tile";
    idx = i;
    var t = tiles[idx];
    t.el.className = "tile on";
    updateHero(t);

    var sc = $("scroller"), g = $("grid");
    var top = t.el.offsetTop, bottom = top + t.el.offsetHeight + 40;
    var cur = g._y || 0, vis = sc.clientHeight;
    if (top + cur < 0) cur = -top + 10;
    else if (bottom + cur > vis) cur = vis - bottom;
    g._y = cur;
    g.style.webkitTransform = g.style.transform = "translateY(" + cur + "px)";
  }

  function move(dir) {
    if (!tiles.length) return;
    var c = tiles[idx].el.getBoundingClientRect();
    var cx = c.left + c.width / 2, cy = c.top + c.height / 2, best = -1, score = 1e9;
    for (var i = 0; i < tiles.length; i++) {
      if (i === idx) continue;
      var r = tiles[i].el.getBoundingClientRect();
      var dx = (r.left + r.width / 2) - cx, dy = (r.top + r.height / 2) - cy, p, q;
      if (dir === "left")  { p = -dx; q = Math.abs(dy); }
      if (dir === "right") { p = dx;  q = Math.abs(dy); }
      if (dir === "up")    { p = -dy; q = Math.abs(dx); }
      if (dir === "down")  { p = dy;  q = Math.abs(dx); }
      if (p < 20) continue;
      var s = p + q * 3;
      if (s < score) { score = s; best = i; }
    }
    if (best > -1) focus(best);
  }

  document.onkeydown = function (e) {
    var k = e.keyCode, handled = true;
    if (k === 37) move("left");
    else if (k === 39) move("right");
    else if (k === 38) move("up");
    else if (k === 40) move("down");
    else if (k === 82 || k === 82) { /* 'R' key to force refresh cloud config */
      toast("Syncing Cloud Config...");
      start();
    } else if (k === 13 || k === 23 || k === 66) {
      if (retryMode) start();
      else if (tiles[idx]) openTile(tiles[idx]);
    } else handled = false;
    if (handled) e.preventDefault();
  };

  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "PM" : "AM";
    h = h % 12;
    if (h === 0) h = 12;
    $("clock").textContent = h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  }
  tick();
  setInterval(tick, 15000);

  function start() { loadConfig(render); }
  window.onpageshow = function () { busy = false; untoast(); start(); };
  start();
})();
</script>
</body>
</html>
